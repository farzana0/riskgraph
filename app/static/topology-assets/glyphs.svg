<?xml version="1.0" encoding="UTF-8"?>
<!-- RiskGraph glyph set. Node kinds, state badges and edge styles used by graph.js.
     Symbols can be referenced with <use href="glyphs.svg#id"> or copied into a page's <defs>.
     Colors match the tokens in graph.css. No scripts, no external references. -->
<svg xmlns="http://www.w3.org/2000/svg" id="riskgraph-glyphs" viewBox="0 0 760 260" width="760" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>RiskGraph glyphs: node kinds, state badges and edge styles</title>
  <defs>
    <!-- Node kinds (r = 17 in the topology) -->
    <symbol id="node-agent" viewBox="-20 -20 40 40"><circle r="17" fill="#ffffff" stroke="#47504b" stroke-width="1.6"/><circle r="4.2" fill="#47504b"/></symbol>
    <symbol id="node-rules" viewBox="-20 -20 40 40"><rect x="-17" y="-17" width="34" height="34" rx="5" fill="#ffffff" stroke="#47504b" stroke-width="1.6"/><text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#47504b">§</text></symbol>
    <symbol id="node-payment" viewBox="-20 -20 40 40"><rect x="-17" y="-17" width="34" height="34" rx="5" fill="#ffffff" stroke="#47504b" stroke-width="1.6"/><text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#47504b">$</text></symbol>
    <symbol id="node-evaluator" viewBox="-20 -20 40 40"><rect x="-17" y="-17" width="34" height="34" rx="5" fill="#ffffff" stroke="#47504b" stroke-width="1.6"/><text y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#47504b">Δ</text></symbol>
    <symbol id="node-input-untrusted" viewBox="-22 -22 44 44"><path d="M0 -19 L19 0 L0 19 L-19 0 Z" fill="#ffffff" stroke="#47504b" stroke-width="1.6" stroke-dasharray="3 2.5"/><text y="4.5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#47504b">?</text></symbol>
    <symbol id="node-input-trusted" viewBox="-22 -22 44 44"><path d="M0 -19 L19 0 L0 19 L-19 0 Z" fill="#ffffff" stroke="#47504b" stroke-width="1.6"/><path d="M-5 -3 H5 M-5 0.5 H5 M-5 4 H5" fill="none" stroke="#47504b" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <!-- State badges (r = 7.5) -->
    <symbol id="badge-completed" viewBox="-8 -8 16 16"><circle r="7.5" fill="#2c7a57"/><path d="M-3.2 0.2 L-1 2.4 L3.3 -2.4" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="badge-blocked" viewBox="-8 -8 16 16"><circle r="7.5" fill="#a2690f"/><path d="M-3 0 H3" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="badge-escalated" viewBox="-8 -8 16 16"><circle r="7.5" fill="#a2690f"/><path d="M0 3.4 V-3 M-2.8 -0.4 L0 -3.2 L2.8 -0.4" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="badge-unsafe" viewBox="-8 -8 16 16"><circle r="7.5" fill="#b03f35"/><path d="M0 -3.4 V0.8 M0 3 V3.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></symbol>
    <symbol id="badge-error" viewBox="-8 -8 16 16"><circle r="7.5" fill="#b03f35"/><path d="M0 -3.4 V0.8 M0 3 V3.1" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></symbol>
  </defs>
  <rect width="760" height="260" fill="#f5f5f2"/>
  <g id="legend-kinds" font-family="system-ui, sans-serif" font-size="12" fill="#1c2320" text-anchor="middle">
    <use href="#node-agent" x="20" y="20" width="60" height="60"/><text x="50" y="96">Agent</text>
    <use href="#node-rules" x="120" y="20" width="60" height="60"/><text x="150" y="96">Policy rules</text>
    <use href="#node-payment" x="220" y="20" width="60" height="60"/><text x="250" y="96">Payment (simulated)</text>
    <use href="#node-evaluator" x="330" y="20" width="60" height="60"/><text x="360" y="96">Evaluator</text>
    <use href="#node-input-untrusted" x="430" y="20" width="60" height="60"/><text x="460" y="96">Untrusted input</text>
    <use href="#node-input-trusted" x="540" y="20" width="60" height="60"/><text x="570" y="96">Trusted record</text>
  </g>
  <g id="legend-states" font-family="system-ui, sans-serif" font-size="12" fill="#1c2320">
    <use href="#badge-completed" x="20" y="130" width="20" height="20"/><text x="46" y="144">Completed</text>
    <use href="#badge-blocked" x="140" y="130" width="20" height="20"/><text x="166" y="144">Blocked / declined</text>
    <use href="#badge-escalated" x="290" y="130" width="20" height="20"/><text x="316" y="144">Escalated</text>
    <use href="#badge-unsafe" x="410" y="130" width="20" height="20"/><text x="436" y="144">Unauthorized payment / error</text>
  </g>
  <g id="legend-edges" font-family="system-ui, sans-serif" font-size="12" fill="#1c2320">
    <path id="edge-executed-ok" d="M20 200 H80" stroke="#2c7a57" stroke-width="2.4" stroke-linecap="round"/><text x="90" y="204">Executed</text>
    <path id="edge-executed-stop" d="M170 200 H230" stroke="#a2690f" stroke-width="2.4" stroke-dasharray="7 4" stroke-linecap="round"/><text x="240" y="204">After a stop</text>
    <path id="edge-executed-unsafe" d="M330 200 H390" stroke="#b03f35" stroke-width="2.4" stroke-linecap="round"/><text x="400" y="204">Unauthorized call</text>
    <path id="edge-structural" d="M20 236 H80" stroke="#c7ccc7" stroke-width="1.3"/><text x="90" y="240">Possible route</text>
    <path id="edge-dataref" d="M190 236 H250" stroke="#8a7a52" stroke-width="1.3" stroke-dasharray="1 4.5" stroke-linecap="round"/><text x="260" y="240">Data reference</text>
    <path id="edge-model" d="M380 236 H440" stroke="#47504b" stroke-width="1.3"/><text x="450" y="240">Model dependency</text>
    <path id="edge-calc" d="M590 236 H650" stroke="#5a6ea3" stroke-width="1.3" stroke-dasharray="5 3.5"/><text x="660" y="240">Calculation</text>
  </g>
</svg>
