name: RiskGraph checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: python scripts/evaluate.py --cases 80 --output evidence/ci.json
      - run: python scripts/evaluate.py --suite adversarial --seed 21031 --cases 40 --output evidence/adversarial-ci.json
      - run: python scripts/evaluate.py --suite full_stress --seed 21021 --cases 56 --output evidence/catalogue-ci.json
