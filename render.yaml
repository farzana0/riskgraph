services:
  - type: web
    name: riskgraph
    runtime: python
    plan: 0.5c-512mb
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    disk:
      name: riskgraph-evidence
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_PATH
        value: /var/data/riskgraph.sqlite3
      - key: RISKGRAPH_ADMIN_TOKEN
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SURREAL_MEMORY_URL
        sync: false
      - key: SURREAL_MEMORY_CONTEXT
        sync: false
      - key: SURREAL_MEMORY_API_KEY
        sync: false
      - key: SURREAL_MEMORY_SCOPE
        value: org/riskgraph/demo
